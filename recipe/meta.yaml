{% set name = "negspacy" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/negspacy-{{ version }}.tar.gz
  sha256: 13d8c4d7bd1b9f5c7e83bc1d7e4689ca70ace3232b8b0c38c22a3807fc0b9a1f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - spacy >=3.8,<4.0
    # - ruff 
    # - pytest-cov 
    # - pytest >=8
    # - pre-commit 

test:
  imports:
    - negspacy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jenojp/negspacy
  summary: A spaCy pipeline object for negation.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
